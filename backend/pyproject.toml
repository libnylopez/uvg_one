[project]
name = "uvg-one-backend"
version = "0.1.0"
description = "Backend de UVG ONE: agente universitario con arquitectura RAG (FastAPI + ChromaDB + Claude)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.4",
    "anthropic>=2.3,<3",
    "chromadb>=1.5,<2",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "loguru>=0.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "greenlet>=3.0",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
